<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330"><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs><rect width="700" height="330" fill="#F4F6FB"/><rect x="225" y="20" width="250" height="80" rx="12" fill="#003399"/><text x="350.0" y="55" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#fff">Comisión Europea</text><text x="350.0" y="80" text-anchor="middle" font-family="Arial" font-size="15" fill="#fff">propone las leyes</text><rect x="30" y="200" width="270" height="80" rx="12" fill="#1C6E3D"/><text x="165.0" y="235" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#fff">Parlamento Europeo</text><text x="165.0" y="260" text-anchor="middle" font-family="Arial" font-size="15" fill="#fff">720 eurodiputados votan</text><rect x="400" y="200" width="270" height="80" rx="12" fill="#8A1538"/><text x="535.0" y="235" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#fff">Consejo de la UE</text><text x="535.0" y="260" text-anchor="middle" font-family="Arial" font-size="15" fill="#fff">ministros de los 27</text><line x1="300" y1="100" x2="190" y2="195" stroke="#333" stroke-width="3" marker-end="url(#m)"/><line x1="400" y1="100" x2="510" y2="195" stroke="#333" stroke-width="3" marker-end="url(#m)"/><line x1="300" y1="240" x2="400" y2="240" stroke="#333" stroke-width="3" stroke-dasharray="6 5"/><text x="350" y="228" text-anchor="middle" font-family="Arial" font-size="14" fill="#222">negocian</text><text x="350" y="310" text-anchor="middle" font-family="Arial" font-size="16" fill="#222">Si ambos aprueban el mismo texto, la ley se adopta</text></svg>